<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>the floor · index</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&display=swap');
:root{--bg:#F2F4F7;--sf:#FFFFFF;--ink:#12161C;--mut:#6B7280;--line:#E3E7ED;--neg:#2A55E0;--ok:#178A5B;--rej:#B3402E;--unk:#D8DDE5;--ask:#8A4FFF}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.45}
button{font:inherit;cursor:pointer}
.brand{font-family:'IBM Plex Mono',monospace;font-size:13px;display:flex;align-items:center;gap:8px}
.brand.big{font-size:14px;margin-bottom:28px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.dot.live{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(23,138,91,.35)}50%{box-shadow:0 0 0 6px rgba(23,138,91,0)}}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--sf);position:sticky;top:0;z-index:2}
.pulse{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-family:'IBM Plex Mono',monospace;font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--bg);color:var(--mut)}
.pill.neg{color:var(--neg)}.pill.ok{color:var(--ok)}.pill.rej{color:var(--rej)}.pill.ask{color:#fff;background:var(--ask)}
.lanes{display:flex;gap:16px;padding:20px 22px 40px;overflow-x:auto;align-items:flex-start}
.lane{flex:0 0 360px;width:360px;border-top:3px solid var(--hue);padding-top:12px}
.lane-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.lane-name{font-weight:600;font-size:16px;display:flex;align-items:center;gap:8px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.eyebrow.pad{padding:0 4px;margin-top:6px}
.intent{font-family:'Fraunces',Georgia,serif;font-weight:300;font-size:20px;line-height:1.25;margin:2px 0 8px}
.empty{color:var(--mut);font-size:13px;margin:4px 0}
.ta,.in{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:inherit;background:#FAFBFC;resize:vertical}
.ta.small{margin-top:8px}
.btn{border:1px solid var(--line);background:var(--sf);border-radius:8px;padding:7px 12px;font-size:13px}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:disabled{opacity:.4;cursor:not-allowed}
.btn.big{padding:11px 18px;font-size:14px;margin-top:18px}
.btn.ghost{background:none;border-style:dashed;color:var(--mut)}
.check{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--mut)}
.check input:disabled + span{opacity:.5}
.check.sub{margin-left:22px;margin-top:6px}
.tag{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
.creds{margin-top:14px}
.disc{background:none;border:0;padding:0;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.disc:hover{color:var(--ink)}
.cred-list{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0 0;align-items:baseline}
.cred-list dt{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mut)}
.cred-list dd{margin:0;min-width:0}
.copy{display:block;width:100%;text-align:left;background:none;border:0;padding:0;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink);overflow-wrap:anywhere}
.copy:hover{color:var(--neg)}
.copy.copied{color:var(--ok)}
.copy.copied::after{content:" copied"; color:var(--ok)}
.cred-note{margin:8px 0 0;font-size:11.5px;color:var(--mut)}
.row-btns{display:flex;gap:8px;margin-top:8px}
.q{padding:10px 0 2px;border-top:1px dashed var(--line);margin-top:10px}
.qwho{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ask);margin-bottom:4px}
.qtext{font-size:14.5px;font-weight:500}
.badge{background:var(--ask);color:#fff;font-family:'IBM Plex Mono',monospace;font-size:10px;border-radius:999px;padding:1px 6px}
.pair{background:var(--sf);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.pair.matched{border-color:rgba(23,138,91,.5)}.pair.rejected{opacity:.62}
.pair.asking{border-color:var(--ask);box-shadow:0 0 0 3px rgba(138,79,255,.10)}
.pair-head-static{display:grid;grid-template-columns:28px 1fr 28px auto;align-items:center;gap:8px;padding:10px 12px}
.av{width:28px;height:28px;border-radius:50%;background:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:11px;border:1px solid var(--line)}
.av.big{width:34px;height:34px;background:var(--hue);color:#fff;border-color:var(--hue)}
.av.tiny{width:22px;height:22px;font-size:10px}
.wire{display:flex;align-items:center;min-width:60px}
.bar{display:flex;gap:2px;width:100%;height:6px}
.seg{flex:1;border-radius:2px;background:var(--unk)}
.bar.busy .seg{animation:shimmer 1.2s ease-in-out infinite}
@keyframes shimmer{0%,100%{opacity:1}50%{opacity:.4}}
.who{display:flex;flex-direction:column;align-items:flex-end}
.nm{font-weight:600;font-size:13px}
.status{font-family:'IBM Plex Mono',monospace;font-size:11px}
.status.negotiating{color:var(--neg)}.status.matched{color:var(--ok)}.status.rejected{color:var(--rej)}.status.waiting{color:var(--mut)}.status.asking{color:var(--ask)}.status.off{color:var(--mut)}
.pair-body{padding:0 12px 12px;border-top:1px dashed var(--line)}
.chat{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.msg{display:flex;gap:8px;align-items:flex-start}
.msg.theirs{flex-direction:row-reverse}
.bub{max-width:82%;background:#F5F7FA;border-radius:12px;padding:8px 10px;font-size:13px;border-top:2px solid var(--h)}
.msg.theirs .bub{background:#EEF1F5}
.bwho{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--mut);margin-bottom:3px;display:flex;justify-content:space-between;gap:10px}
.handoff{margin:10px 0 0;color:var(--ok);font-size:13px}
.stalled{margin:10px 0 0;color:var(--mut);font-size:12.5px}
.activity{display:flex;align-items:center;gap:7px;margin:8px 0 0;color:var(--ask);font-family:'IBM Plex Mono',monospace;font-size:11.5px}
.activity .dot{background:var(--ask)}
.setup{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px}
.setup-inner{max-width:1080px;width:100%;background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:32px}
.setup h1{font-family:'Fraunces',Georgia,serif;font-weight:300;font-size:32px;line-height:1.1;margin:0 0 12px}
.lede{color:var(--mut);margin:0 0 22px;font-size:14px}
.seat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:8px 0 14px}
.seat-card{border:1px solid var(--line);border-top:3px solid var(--hue);border-radius:12px;padding:12px;background:#FAFBFC;display:flex;flex-direction:column;gap:8px}
.seat-head{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.drop{margin-left:auto;background:none;border:0;color:var(--mut);font-size:16px;line-height:1;padding:0 2px}
.drop:hover{color:var(--rej)}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--sf);border-radius:999px;padding:4px 10px;font-size:12px}
.start-error{color:var(--rej);font-size:13px;margin-top:8px}
@media (max-width:820px){.lanes{flex-direction:column}.lane{flex:1 1 auto;width:100%}}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
const PALETTE = ["#12161C", "#2A55E0", "#B3402E", "#178A5B", "#8A4FFF", "#B07D00", "#0F7B8A", "#8A2E6B"];
const hue = (index) => PALETTE[index % PALETTE.length];
// Index refuses a signal it cannot act on, so the presets carry the specifics
// — domain, stage, check size — that a bare "looking for an investment" lacks.
const PRESETS = [
  "I am in SF raising a seed round for an AI infrastructure startup and want a 500k lead check.",
  "I am in NYC and invest in early stage AI infrastructure startups, writing 250k-750k lead checks.",
];

const app = document.getElementById("app");
const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const initials = (name) => (name || "?").split(" ").map((part) => part[0]).join("").slice(0, 2).toUpperCase();
const first = (name) => (name || "").split(" ")[0];

const blank = () => ({ name: "", intent: "", profile: "", location: "", enabled: true, mayAsk: false, guestEmail: "" });
const drafts = [blank(), blank()];
let guests = [];
let state = null;
let starting = false;
let startError = null;
const answerDrafts = {};

// Fetched once, off the snapshot stream, and never part of the render
// signature — opening a seat's credentials is a local gesture, not run state.
let creds = null;
const opened = {};

function setupView() {
  const ready = drafts.length >= 2 && drafts.every((seat) => seat.guestEmail || seat.intent.trim());
  app.innerHTML = `
    <div class="setup"><div class="setup-inner">
      <div class="brand big"><span class="dot live"></span> the floor · index</div>
      <h1>A room of people, one screen.<br />Real users, real agents.</h1>
      <p class="lede">Each run registers the people you list and a private network only they are in. Index pairs off everyone it can, so a floor of five can hold ten negotiations at once. Say what each side actually wants — Index turns away a signal too vague to act on.</p>
      <div class="seat-grid">
        ${drafts.map((seat, index) => seatCard(seat, index)).join("")}
      </div>
      <button class="btn ghost" id="add">+ Add player</button>
      ${startError ? `<p class="start-error">${esc(startError)}</p>` : ""}
      <button class="btn primary big" id="start" ${starting || !ready ? "disabled" : ""}>
        ${starting ? "Provisioning…" : "Enter the floor"}
      </button>
    </div></div>`;

  app.querySelectorAll("[data-field]").forEach((input) => {
    input.addEventListener("input", () => {
      drafts[Number(input.dataset.seat)][input.dataset.field] = input.value;
      document.getElementById("start").disabled =
        starting || !drafts.every((seat) => seat.guestEmail || seat.intent.trim());
    });
  });
  app.querySelectorAll("[data-draft-switch]").forEach((box) => {
    box.addEventListener("change", () => {
      drafts[Number(box.dataset.seat)][box.dataset.draftSwitch] = box.checked;
      setupView();
    });
  });
  app.querySelectorAll("[data-guest]").forEach((picker) => {
    picker.addEventListener("change", () => {
      drafts[Number(picker.dataset.guest)].guestEmail = picker.value;
      setupView();
    });
  });
  app.querySelectorAll("[data-preset]").forEach((chip) => {
    chip.addEventListener("click", () => {
      drafts[Number(chip.dataset.seat)].intent = chip.dataset.preset;
      setupView();
    });
  });
  app.querySelectorAll("[data-drop]").forEach((button) => {
    button.addEventListener("click", () => {
      drafts.splice(Number(button.dataset.drop), 1);
      setupView();
    });
  });
  document.getElementById("add").addEventListener("click", () => {
    drafts.push(blank());
    setupView();
  });
  document.getElementById("start").addEventListener("click", start);
}

function seatCard(seat, index) {
  // A person already seated elsewhere on this floor drops out of the other
  // pickers: the same account cannot hold two seats in one network.
  const offered = guests.filter((email) => email === seat.guestEmail || !drafts.some((row) => row.guestEmail === email));

  return `<div class="seat-card" style="--hue:${hue(index)}">
    <div class="seat-head">
      <span class="av tiny" style="background:${hue(index)};color:#fff;border-color:${hue(index)}">${index + 1}</span>
      <span>Player ${index + 1}</span>
      ${drafts.length > 2 ? `<button class="drop" data-drop="${index}" title="Remove">×</button>` : ""}
    </div>
    ${guests.length ? `<select class="in" data-guest="${index}">
      <option value="">Generate an ephemeral player</option>
      ${offered.map((email) => `<option value="${esc(email)}" ${seat.guestEmail === email ? "selected" : ""}>${esc(email)}</option>`).join("")}
    </select>` : ""}
    ${seat.guestEmail ? '<p class="empty">They are added to this run\'s network. Their signals and their agent are their own — the floor writes nothing for them.</p>' : `
      <input class="in" data-field="name" data-seat="${index}" value="${esc(seat.name)}" placeholder="Name" />
      <input class="in" data-field="location" data-seat="${index}" value="${esc(seat.location)}" placeholder="Location (optional)" />
      <textarea class="ta" rows="2" data-field="profile" data-seat="${index}" placeholder="Who they are (optional)">${esc(seat.profile)}</textarea>
      <textarea class="ta" rows="2" data-field="intent" data-seat="${index}" placeholder="Intent, in plain words">${esc(seat.intent)}</textarea>
      <div class="presets">${PRESETS.map((preset) => `<button type="button" class="chip" data-preset="${esc(preset)}" data-seat="${index}">${esc(preset.slice(0, 30))}…</button>`).join("")}</div>
      <label class="check">
        <input type="checkbox" data-draft-switch="enabled" data-seat="${index}" ${seat.enabled ? "checked" : ""} />
        <span>Enable negotiations</span>
      </label>
      <label class="check sub">
        <input type="checkbox" data-draft-switch="mayAsk" data-seat="${index}" ${seat.mayAsk ? "checked" : ""} ${seat.enabled ? "" : "disabled"} />
        <span>Ask questions</span>
      </label>`}
  </div>`;
}

async function start() {
  starting = true;
  startError = null;
  setupView();
  try {
    const response = await fetch("/api/runs", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ seats: drafts }),
    });
    const body = await response.json();
    if (!response.ok) throw new Error(body.error || "Could not start the run");
    listen(body.runId);
  } catch (error) {
    starting = false;
    startError = error.message;
    setupView();
  }
}

function listen(runId) {
  location.hash = runId;
  const source = new EventSource(`/api/runs/${runId}/events`);
  source.addEventListener("error", () => {
    if (source.readyState === EventSource.CLOSED) location.hash = "";
  });
  source.onmessage = (event) => {
    state = JSON.parse(event.data);
    render(runId);
  };
  source.onerror = () => {
    if (state) state.phase = "reconnecting to the floor";
    render(runId);
  };
}

const seatOf = (slot) => state.seats.find((seat) => seat.slot === slot);
const hueOf = (slot) => hue(state.seats.findIndex((seat) => seat.slot === slot));
const held = (slot) => state.negotiations.filter((live) => live.slots.includes(slot));
const other = (seat, live) => seatOf(live.slots.find((slot) => slot !== seat.slot));

async function showCredentials(runId, slot) {
  opened[slot] = !opened[slot];
  if (opened[slot] && !creds) {
    const response = await fetch(`/api/runs/${runId}/credentials`);
    if (response.ok) creds = await response.json();
  }
  draw(runId);
}

async function setSwitch(runId, slot, changes) {
  await fetch(`/api/runs/${runId}/seats/${slot}/settings`, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify(changes),
  });
}

/**
 * A snapshot lands every few seconds and redraws the screen. Whatever the
 * person is part-way through typing has to survive that, or an answer longer
 * than one poll can never be finished.
 */
function keepTyping(redraw) {
  const focused = document.activeElement;
  const focusedKey = focused?.dataset?.answerFor ?? null;
  const caret = focusedKey ? focused.selectionStart : 0;
  for (const box of app.querySelectorAll("textarea[data-answer-for]")) {
    answerDrafts[box.dataset.answerFor] = box.value;
  }

  redraw();

  for (const box of app.querySelectorAll("textarea[data-answer-for]")) {
    box.value = answerDrafts[box.dataset.answerFor] ?? "";
  }
  if (focusedKey) {
    const box = app.querySelector(`textarea[data-answer-for="${focusedKey}"]`);
    box?.focus();
    box?.setSelectionRange(caret, caret);
  }
}

let lastDrawn = null;

function render(runId) {
  if (!state) return;

  // A clock ticking on its own is not a reason to rebuild the screen — and
  // rebuilding it under someone who is part-way through an answer is how that
  // answer gets lost. Only a real change redraws; the clock moves on its own.
  const { elapsed, ...meaningful } = state;
  const signature = JSON.stringify(meaningful);
  if (signature === lastDrawn) {
    for (const clock of app.querySelectorAll(".elapsed")) clock.textContent = elapsed;
    return;
  }

  lastDrawn = signature;
  keepTyping(() => draw(runId));
}

function draw(runId) {
  if (state.state === "failed") {
    app.innerHTML = `<div class="setup"><div class="setup-inner">
      <div class="brand big"><span class="dot" style="background:var(--rej)"></span> the floor · run ${esc(state.runId)}</div>
      <h1>The floor could not open.</h1>
      <p class="start-error">${esc(state.error)}</p>
      <button class="btn primary big" onclick="location.hash=''; location.reload()">Start over</button>
    </div></div>`;
    return;
  }

  if (state.state === "provisioning") {
    app.innerHTML = `<div class="setup"><div class="setup-inner">
      <div class="brand big"><span class="dot live"></span> the floor · run ${esc(state.runId)}</div>
      <h1>Setting the floor.</h1>
      <p class="activity"><span class="dot live"></span> ${esc(state.phase)} · <span class="elapsed">${state.elapsed}</span>s</p>
    </div></div>`;
    return;
  }

  const open = state.negotiations.filter((live) => !live.outcome && !live.stalled).length;
  const matched = state.negotiations.filter((live) => live.outcome === "agreed").length;
  const rejected = state.negotiations.filter((live) => live.outcome === "declined").length;
  const questions = state.negotiations.filter((live) => live.question).length;

  app.innerHTML = `
    <header class="top">
      <div class="brand"><span class="dot live"></span> the floor · run ${esc(state.runId)}</div>
      <div class="pulse">
        <span class="pill">${state.seats.length} players</span>
        <span class="pill neg">${open} open</span>
        <span class="pill ok">${matched} matched</span>
        <span class="pill rej">${rejected} rejected</span>
        ${questions ? `<span class="pill ask">${questions} question${questions > 1 ? "s" : ""}</span>` : ""}
      </div>
    </header>
    <main class="lanes">${state.seats.map(lane).join("")}</main>`;

  app.querySelectorAll("[data-switch]").forEach((box) => {
    box.addEventListener("change", () => {
      box.disabled = true;
      void setSwitch(runId, box.dataset.slot, { [box.dataset.switch]: box.checked });
    });
  });

  app.querySelectorAll("[data-creds]").forEach((button) => {
    button.addEventListener("click", () => void showCredentials(runId, button.dataset.creds));
  });

  app.querySelectorAll("[data-copy]").forEach((button) => {
    button.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(button.dataset.copy);
      } catch {
        // Refused without focus, and over plain http in some browsers.
        // Selecting the value still lets you take it.
        getSelection().selectAllChildren(button);
        return;
      }
      button.classList.add("copied");
      setTimeout(() => button.classList.remove("copied"), 1200);
    });
  });

  app.querySelectorAll("[data-answer]").forEach((button) => {
    button.addEventListener("click", async () => {
      const box = app.querySelector(`textarea[data-answer-for="${button.dataset.answer}"]`);
      const text = box.value.trim();
      if (!text) return;
      button.disabled = true;
      button.textContent = "Answering…";
      answerDrafts[button.dataset.answer] = "";
      await fetch(`/api/runs/${runId}/negotiations/${button.dataset.answer}/answer`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ text }),
      });
    });
  });
}

function lane(seat) {
  const asked = held(seat.slot).filter((live) => live.question && live.askedBy === seat.slot).length;

  return `<section class="lane" style="--hue:${hueOf(seat.slot)}">
    <div class="lane-head">
      <span class="av big">${esc(initials(seat.name))}</span>
      <div class="lane-name">${esc(seat.name)}${asked ? `<span class="badge">${asked}</span>` : ""}</div>
      ${seat.kind === "guest" ? '<span class="tag">guest</span>' : ""}
    </div>

    <div class="card">
      <div class="eyebrow">${seat.kind === "guest" ? "Member" : "Intent"}</div>
      ${seat.kind === "guest"
        ? `<p class="intent">${esc(seat.email)}</p>`
        : `<p class="intent">“${esc(seat.intent)}”</p>`}
    </div>

    ${controls(seat)}
    ${seat.error ? `<div class="card"><p class="stalled">${esc(seat.error)}</p></div>` : ""}
    ${negotiations(seat)}
    ${credentials(seat)}
  </section>`;
}

function controls(seat) {
  if (seat.kind === "guest") {
    return `<div class="card">
      <div class="eyebrow">Added, not driven</div>
      <p class="empty">They are a member of this run's network. Nothing appears here until they bring a
      signal to it and their own agent answers.</p>
    </div>`;
  }

  const done = seat.status === "done";
  return `<div class="card">
    <div class="eyebrow">Agent</div>
    <label class="check">
      <input type="checkbox" data-switch="enabled" data-slot="${seat.slot}" ${seat.enabled ? "checked" : ""} ${done ? "disabled" : ""} />
      <span>Enable negotiations</span>
    </label>
    <label class="check sub">
      <input type="checkbox" data-switch="mayAsk" data-slot="${seat.slot}" ${seat.mayAsk ? "checked" : ""} ${seat.enabled && !done ? "" : "disabled"} />
      <span>Ask questions</span>
    </label>
    ${seat.enabled ? "" : '<p class="empty">Switched off. This seat is seated and discoverable, and answers nobody.</p>'}
  </div>`;
}

/**
 * Everything this seat is in the middle of. What is blocked on the person
 * comes first, then whatever is still moving, then the settled ones — the
 * order you would work through them in, not the order they opened.
 */
function negotiations(seat) {
  const rank = (live) => (live.question && live.askedBy === seat.slot ? 0 : live.outcome || live.stalled ? 2 : 1);
  const list = held(seat.slot).slice().sort((one, two) => rank(one) - rank(two));

  // A guest's own card already says why their lane is empty.
  if (!list.length) {
    return seat.kind === "guest" ? "" : `<div class="card">
      <p class="activity"><span class="dot live"></span> ${esc(state.phase)} · <span class="elapsed">${state.elapsed}</span>s</p>
    </div>`;
  }
  return list.map((live) => pair(seat, live)).join("");
}

function pair(seat, live) {
  const them = other(seat, live);
  const { label, cls } = standing(seat, them, live);
  const mineHue = hueOf(seat.slot);
  const theirHue = hueOf(them.slot);

  const chat = live.turns.map((turn) => {
    const ours = turn.slot === seat.slot;
    const who = ours ? seat : them;
    return `<div class="msg ${ours ? "mine" : "theirs"}">
      <span class="av tiny" style="background:${ours ? mineHue : theirHue};color:#fff">${esc(initials(who.name))}</span>
      <div class="bub" style="--h:${ours ? mineHue : theirHue}">
        <div class="bwho"><span>${esc(first(who.name))}'s agent</span><span>${esc(turn.action)}</span></div>
        ${esc(turn.message)}
      </div></div>`;
  }).join("");

  const asking = live.question && live.askedBy === seat.slot;
  return `<div class="pair ${esc(cls)}">
    <div class="pair-head-static">
      <span class="av" style="background:${mineHue};color:#fff;border-color:${mineHue}">${esc(initials(seat.name))}</span>
      <span class="wire"><span class="bar ${cls === "negotiating" ? "busy" : ""}"><span class="seg"></span><span class="seg"></span><span class="seg"></span></span></span>
      <span class="av" style="background:${theirHue};color:#fff;border-color:${theirHue}">${esc(initials(them.name))}</span>
      <span class="who">
        <span class="nm">${esc(them.name)}</span>
        <span class="status ${esc(cls)}">${esc(label)}</span>
      </span>
    </div>
    <div class="pair-body">
      ${chat ? `<div class="chat">${chat}</div>` : '<p class="empty">Opened. No turns yet.</p>'}
      ${live.activity ? `<p class="activity"><span class="dot live"></span> ${esc(live.activity)}</p>` : ""}
      ${live.outcome === "agreed" ? `<p class="handoff">Matched (pending). The agents are done; talk to ${esc(first(them.name))} directly.</p>` : ""}
      ${live.stalled ? '<p class="stalled">Spent its turn budget with the exchange still open.</p>' : ""}
      ${asking ? `
        <div class="q">
          <div class="qwho">${seat.mayAsk
            ? `unblocks this negotiation with <b>${esc(first(them.name))}</b>`
            : "it could not proceed without this, even with questions off"}</div>
          <div class="qtext">${esc(live.question)}</div>
          <textarea class="ta small" rows="2" data-answer-for="${esc(live.opportunityId)}" placeholder="One sentence is enough"></textarea>
          <div class="row-btns"><button class="btn primary" data-answer="${esc(live.opportunityId)}">Answer</button></div>
        </div>` : ""}
    </div>
  </div>`;
}

/** Where this one negotiation stands, said from this seat's side of it. */
function standing(seat, them, live) {
  if (live.outcome === "agreed") return { label: "matched", cls: "matched" };
  if (live.outcome) return { label: live.outcome, cls: "rejected" };
  if (live.stalled) return { label: "stalled", cls: "waiting" };
  if (live.question) {
    return live.askedBy === seat.slot
      ? { label: "waiting on you", cls: "asking" }
      : { label: `waiting on ${first(them.name)}`, cls: "asking" };
  }
  const holder = live.awaitingSlot === seat.slot ? seat : live.awaitingSlot === them.slot ? them : null;
  if (holder?.kind === "guest") {
    // Nothing is switched off here: the floor was never going to move for them.
    const label = holder === seat ? "waiting on their own agent" : `waiting on ${first(them.name)}'s agent`;
    return { label, cls: "waiting" };
  }
  if (holder && !holder.enabled) {
    return { label: holder === seat ? "your agent is off" : `${first(them.name)}'s agent is off`, cls: "off" };
  }
  return { label: "agents talking", cls: "negotiating" };
}

/** An ephemeral account was made for this seat. This is how you sign in as it. */
function credentials(seat) {
  // A guest's key is their own, handed to the floor in its env, not ours to show.
  if (seat.kind === "guest") return "";

  const mine = creds?.seats.find((row) => row.slot === seat.slot);
  return `<div class="creds">
    <button class="disc" data-creds="${seat.slot}">${opened[seat.slot] ? "▾" : "▸"} Credentials</button>
    ${opened[seat.slot] && mine ? `
      <dl class="cred-list">
        ${credRow("email", mine.email)}
        ${credRow("password", creds.password)}
        ${credRow("agent token", mine.apiKey)}
      </dl>
      <p class="cred-note">Every ephemeral seat in a run shares one password.</p>` : ""}
  </div>`;
}

const credRow = (label, value) => `<dt>${esc(label)}</dt>
  <dd><button class="copy" data-copy="${esc(value)}" title="Copy">${esc(value)}</button></dd>`;

const resuming = location.hash.slice(1);
if (resuming) {
  listen(resuming);
} else {
  setupView();
  fetch("/api/guests")
    .then((response) => response.json())
    .then((body) => {
      guests = body.guests ?? [];
      if (guests.length) setupView();
    })
    .catch(() => {});
}
</script>
</body>
</html>
