# Railpack, not Nixpacks: Nixpacks pulls a Node it no longer has and reads Bun
# as a side dish, where Railpack takes bun.lock at face value.
[build]
builder = "RAILPACK"

[deploy]
startCommand = "bun run src/server.ts"
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Runs are held in memory, so a second instance would serve half the seats.
numReplicas = 1
